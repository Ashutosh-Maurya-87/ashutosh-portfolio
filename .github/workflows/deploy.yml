name: Deploy React Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # Trigger the workflow when code is pushed or merged into the 'main' branch

jobs:
  build-and-deploy:
    # Use the latest Ubuntu environment to run the steps
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      # Action to check out your repository code
      uses: actions/checkout@v3
      
    - name: Set up Node.js
      # Action to install Node.js environment
      uses: actions/setup-node@v3
      with:
        node-version: '16' # Recommended LTS version for React apps

    - name: Install Dependencies
      # Install project dependencies
      run: npm install
      
    - name: Run Build (Creates 'build' folder)
      # Build the React application
      run: npm run build
      
    # -------------------------------------------------------------
    # FIXED DEPLOYMENT STEP: 
    # This step uses a dedicated action that correctly handles authentication 
    # and bypasses the manual Git configuration issue you were seeing.
    # -------------------------------------------------------------
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        # GITHUB_TOKEN is automatically provided by GitHub Actions for write permissions
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # The directory to deploy (React's production output)
        publish_dir: ./build
        # The branch where the static files will be hosted
        publish_branch: gh-pages
