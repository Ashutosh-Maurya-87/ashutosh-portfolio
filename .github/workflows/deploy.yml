name: Deploy React Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # Trigger the workflow when code is pushed or merged into the 'main' branch

jobs:
  build-and-deploy:
    # Use the latest Ubuntu environment to run the steps
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      # Action to check out your repository code
      uses: actions/checkout@v3
      
    - name: Set up Node.js
      # Action to install Node.js environment
      uses: actions/setup-node@v3
      with:
        node-version: '16' # Recommended LTS version for React apps

    - name: Install Dependencies
      # Install project dependencies, including 'gh-pages' (which you added to package.json)
      run: npm install
      
    # -------------------------------------------------------------
    # NEW STEP ADDED: Configure Git User for gh-pages
    # This fixes the "Author identity unknown" ProcessError.
    # -------------------------------------------------------------
    - name: Configure Git User
      run: |
        git config user.email "ashumaurya486@gmail.com"
        git config user.name "Ashutosh-Maurya-87"
      
    - name: Run Build and Deploy
      # Runs the 'predeploy' (npm run build) and 'deploy' (gh-pages -d build) scripts sequentially.
      # The deploy step pushes the contents of the 'build' folder to the 'gh-pages' branch.
      run: npm run deploy
      env:
        # Pass the GitHub Personal Access Token (PAT) for deployment authentication.
        # GITHUB_TOKEN is a secret automatically provided by GitHub Actions.
        # We use a custom token here because 'gh-pages' sometimes requires explicit configuration.
        # This uses the default GitHub Token which has permissions to push to 'gh-pages'.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Setting the Public URL environment variable for robustness
        PUBLIC_URL: /ashutosh-portfolio
